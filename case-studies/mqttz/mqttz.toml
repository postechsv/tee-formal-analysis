# MQT-TZ case study: what the analyzed system is.  How it is analyzed (plain model checking, DMC,
# maude2lean) is chosen when it is built, not here.

# Rule conditions dropped for the analysis (tools/build/drop-condition.py).  The spec follows the
# rules printed in the paper: a TA-side rule fires only when the status of the TA is normal, so a TA
# whose memory is exhausted (the out-of-memory threat, threats/) stops at its next step.  The paper
# artifact checks the status only in the functions that allocate memory, so its TA goes on after a
# memory error and only an allocation fails.  Here `status : normal` is removed from the left-hand
# side of the TA-side rules (a syntactic change): they fire in any status, panic included, which
# over-approximates the TA.
[drop-rule-condition]
class     = "TAKernel"                 # and its subclass TrustedApp
condition = "status : normal"
rules     = ["*"]
except    = [                          # the functions that allocate memory keep the condition
  "allocate-transient-*",
  "alloc-oper-*",
  "alloc-enumerator-*",
  "open-persistent-*",
  "create-persist*",
]


# Ghost state read by the LTL propositions (properties/propositions.maude).

# running: the TA serves a request, from its start to its finish or to the answer of a panicked TA.
[ghost]
var           = "running"
class         = "TrustedApp"
initial-value = false
true-after    = ["handle-invoke-ta", "handle-session-req"]
false-after   = ["handle-invoke-ta-finish", "handle-session-req-finish",
                 "handle-session-req-panic", "return-smc-request-panic"]


# The invisible-transition reduction (make mqttz INVISIBLE=1, tools/build/gen-invisible.py): the rules
# listed here become equations.  They follow Section 8.1 of the paper: G = G1 + G2 + G3, rules that
# affect a single object and do not change the value of a proposition of the properties
# (properties/properties.maude); a listed rule must not update a ghost attribute above.
#   G1: the start rules (api-call init) and finish rules (api-call final) of the TEE API functions
#       on the TA object alone, except those that panic the TA.  Not here: the exec-stage and
#       handle-side rules, rules on several objects, and the TEE Client API rules of the RA
#       (tee-client.maude), as the paper argues termination and confluence for TAs only.
#   G2: the K rules (imp.maude) except loops (while) and function calls (fCall, fExec, bindV,
#       bindR, bindS, fRetn, fQuit).
#   G3: the rules by which a TA calls a TEE API function.
[invisible]
rules = [
  # G2
  "lookup",
  "lookup-lv",
  "member-lvalue",
  "assign",
  "op-plus",
  "op-minus",
  "op-times",
  "op-div",
  "op-leq",
  "op-eq",
  "op-and-true",
  "op-and-false",
  "op-or-true",
  "op-or-false",
  "op-not",
  "skip",
  "seq",
  "if-true",
  "if-false",
  "allocA",
  "alloc",
  "allocObj",
  "malloc",
  "fdecl",
  "fdecl-lib",
  "sdecl",
  "assign-list",
  "assign-list-end",
  # G3
  "tee-api-call",
  "tee-api-call-accept",
  "tee-api-call-return",
  # G1: transient.maude
  "allocate-transient-success",
  "allocate-transient-out-of-memory-err",
  "allocate-transient-not-supported-err",
  "free-transient-not-null-subroutine",
