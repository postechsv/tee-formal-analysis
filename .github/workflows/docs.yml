# Build the documentation site of the spec (tools/gen-docs.py on spec/src) and deploy it to GitHub Pages.
name: Docs

on:
  push:
    branches: [main]
    paths: [spec, docs/**, tools/gen-docs.py, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Generate site
        run: python3 tools/gen-docs.py --src spec/src --out build/docs --overview docs/overview.html --examples docs/examples.json --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
