# MQT-TZ: the model checking of the paper.
# An analysis file (tools/build/tee-build.py), standalone: the analyzed system ([spec], [ta.*],
# [ra.*]) and how it is analyzed (mode, output, and the transforms of the spec build below).
# make model-checking builds it from this file, core/ and the spec into the output directory.
#
# Model checking of the MQT-TZ LTL properties (core/properties/) under the threats of core/threats/,
# with the invisible-transition reduction of the paper: Table 2 and Table 3 (scripts/).  The analysis
# has mode (plain | dmc | m2l: how the spec is built) and the transforms of the spec build:
# drop-class-attribute, ghost and invisible (without invisible, there is no reduction).
mode = "plain"                         # plain | dmc | m2l: how the spec is built
output = "models/model-checking"       # the directory of the built model

# Rules of the spec that this analysis leaves out (tools/build/drop-rules.py).  As in the paper
# artifact, a panicked TA blocks its client: the request that was being served gets
# TEE_ERROR_TARGET_DEAD (return-smc-request-panic), but a later request through the session of the
# panicked instance is never answered, so the RA and the broker stop.  The spec answers such a
# request at once with TEE_ERROR_TARGET_DEAD (handle-smc-request-target-dead, as GP does), after
# which the original RA forwards a message the TA never wrote, and P1 holds under the message
# intruder; the paper reports P1 violated there (Table 10).
drop-rules = ["handle-smc-request-target-dead"]

# The specification: a revision of tee-formal-spec, fetched into build/spec/ and built with its
# Makefile (a branch or a tag is fetched again at every build; a commit is fixed).  The spec
# selects its feature groups (the defaults of its features.mk); [spec.features] overrides them
# (e.g. CRYPTO = 0).
[spec]
repo = "https://github.com/postechsv/tee-formal-spec"
rev  = "a4bf510a13f8be0479e3bdb744851456747b9363"   # main, PR #12 merged


# The broker TA, preprocessed from the upstream C source by tools/lang-preprocess.py (see its docstring).
[ta.broker]
source    = "core/ta/hot_cache_ta.c"   # MQT-TZ, as published
patches   = ["core/ta/model.patch"]    # the modeling changes of the C code (see the patch)
functions = ["payload_reencryption"]   # and the functions it calls
structs   = ["aes_cipher", "mqttz_client"]
entry     = "TA_InvokeCommandEntryPoint"   # the entry point of the model (RA interface)
template  = "core/ta/template.maude"
output    = "broker-ta.maude"
drop-vars = ["TA_InvokeCommandEntryPoint.param_types"]   # the parameter types are not modeled


# The memory references of the entry point: a reference is the mqttz_client of the RA, and a part
# of it is the field at its offset (model.patch, 4).
[ta.broker.memref.TA_InvokeCommandEntryPoint]
signature = "int command, (struct MqttzClient) * origin, (struct MqttzClient) * dest"
"params[0].memref.buffer" = "origin -> cliId"
"params[0].memref.buffer + TA_MQTTZ_CLI_ID_SZ" = "origin -> iv"
"params[0].memref.buffer + TA_MQTTZ_CLI_ID_SZ + TA_AES_IV_SIZE" = "origin -> data"
"params[1].memref.buffer" = "dest -> cliId"
"params[1].memref.buffer + TA_MQTTZ_CLI_ID_SZ + TA_AES_IV_SIZE" = "dest -> data"

[ta.broker.programs]
mqttzTA        = []
mqttzTaPatched = ["core/ta/fix.patch"] # code-level patch: a failed alloc_resources is out of memory

# The RA of the broker, preprocessed from the upstream host the same way.  The model keeps the call of
# the TA (payload_reencryption); core/ra/main.imp is its entry point, which the broker runs for a
# message.
[ra.host]
source     = "core/ra/main.c"           # hot_cache/host/main.c of mqttz/optee-apps, as published
patches    = ["core/ra/model.patch"]    # the modeling changes of the C code (see the patch)
functions  = ["payload_reencryption"]
structs    = ["mqttz_client"]
main       = "core/ra/main.imp"         # the entry point of the model (the broker interface)
template   = "core/ra/template.maude"
output     = "broker-ra.maude"
drop-calls = ["memset"]
drop-vars  = ["payload_reencryption.ori"]   # the return origin is not modeled
# TEEC_InvokeCommand: the TA function that serves the command, and the variable that gets the return
# code of the TA (ra/model.patch, 3)
invoke     = { entry = "main", ta-result = "ta_res" }

[ra.host.programs]
mqttzHost        = []
mqttzHostPatched = ["core/ra/fix.patch"] # code-level patch: a failed re-encryption is discarded

# Class attributes dropped from rule left-hand sides for the analysis
# (tools/build/drop-class-attribute.py).  The spec follows the rules printed in the paper: a TA-side
# rule fires only when the status of the TA is normal, so a TA whose memory is exhausted (the
# out-of-memory threat, core/threats/) stops at its next step.  The paper artifact checks the
# status only in the functions that allocate memory, so its TA goes on after a memory error and
# only an allocation fails.  Here `status : normal` is removed from the left-hand side of the
# TA-side rules (a syntactic change): they fire in any status, panic included, which
# over-approximates the TA.
[drop-class-attribute]
class          = "TAKernel"            # and its subclass TrustedApp
attribute      = "status : normal"
affected-rules = ["*"]
excluded-rules = [                     # the functions that allocate memory keep the condition
  "allocate-transient-*",
  "alloc-oper-*",
  "alloc-enumerator-*",
  "open-persistent-*",
  "create-persist*",
]


# Ghost state read by the LTL propositions (core/properties/propositions.maude).

# running: the TA serves a request, from its start to its finish or to the answer of a panicked TA.
[ghost]
var           = "running"
class         = "TrustedApp"
initial-value = false
# A TA serves the requests of its RA and TA clients alike by handle-invoke-ta and
# handle-invoke-ta-finish.  A panicked TA stays running: the panic keeps it from finishing (P4).
# return-session-request-panic (the same for a TA client) has two TrustedApp objects on its
# left-hand side, which ghost.py does not support; the TA of MQT-TZ has no TA client.
true-after    = ["handle-invoke-ta"]
false-after   = ["handle-invoke-ta-finish"]


# The invisible-transition reduction (tools/build/gen-invisible.py): the rules
# listed here become equations.  They follow Section 8.1 of the paper: G = G1 + G2 + G3, rules that
# affect a single object and do not change the value of a proposition of the properties
# (core/properties/properties.maude); a listed rule must not update a ghost attribute above.
#   G1: the start rules (api-call init) and finish rules (api-call final) of the TEE API functions
#       on the TA object alone, except those that panic the TA.  Not here: the exec-stage and
#       handle-side rules, rules on several objects, and the TEE Client API rules of the RA
#       (tee-client.maude), as the paper argues termination and confluence for TAs only.
#   G2: the K rules (lang/c/semantics.maude) except loops (while) and function calls (fCall, fExec, bindV,
#       bindR, bindS, fRetn, fQuit).
#   G3: the rules by which a TA calls a TEE API function.
[invisible]
rules = [
  # G2
  "lookup",
  "lookup-lv",
  "member-lvalue",
  "assign",
  "op-plus",
  "op-minus",
  "op-times",
  "op-div",
  "op-leq",
  "op-eq",
  "op-and-true",
  "op-and-false",
  "op-or-true",
  "op-or-false",
  "op-not",
  "skip",
  "seq",
  "if-true",
  "if-false",
  "allocA",
  "alloc",
  "allocObj",
  "malloc",
  "fdecl",
  "sdecl",
  # G3
  "tee-api-call",
  "tee-api-call-accept",
  "tee-api-call-return",
  # G1: transient.maude
  "allocate-transient-success",
  "allocate-transient-out-of-memory-err",
  "allocate-transient-not-supported-err",
  "free-transient-not-null-subroutine",
  "free-transient-not-null-success",
  "free-transient-null-success",
  "reset-transient-not-null-subroutine",
  "reset-transient-not-null-success",
